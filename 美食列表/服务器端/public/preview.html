<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>美食列表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #d8d8d8;
      display: flex;
      justify-content: center;
      padding: 24px 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .phone {
      width: 390px;
      background: #f8eaea;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.16);
    }
    .status {
      height: 28px;
      background: #d8b5b5;
      color: #222;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      align-items: center;
    }
    .nav {
      height: 44px;
      background: #d8b5b5;
      color: #222;
      text-align: center;
      line-height: 44px;
      font-size: 17px;
      font-weight: 600;
    }
    .item {
      display: flex;
      padding: 8px;
      margin: 8px;
      border: 1px solid #cc8c8c;
      border-radius: 6px;
      background: #fff;
      box-shadow: 1px 1px 8px rgb(196, 130, 130);
    }
    .item img {
      width: 125px;
      height: 125px;
      object-fit: cover;
      border-radius: 6px;
      margin-right: 8px;
      flex-shrink: 0;
      background: #f3e6e6;
    }
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      font-size: 12px;
      color: #555;
      line-height: 1.45;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 8px 0 16px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>微信开发者工具</span></div>
    <div class="nav">美食</div>
    <div id="list"></div>
    <div class="footer">上拉加载更多</div>
  </div>
  <script>
    function splitPhone(str) {
      if (!str || str.length !== 11) return str || "";
      var arr = str.split("");
      arr.splice(3, 0, "-");
      arr.splice(8, 0, "-");
      return arr.join("");
    }
    fetch("/data?page=1&pageSize=4")
      .then(function (r) { return r.json(); })
      .then(function (list) {
        document.getElementById("list").innerHTML = list.map(function (item) {
          return (
            '<div class="item">' +
              '<img src="' + item.image + '" alt="" />' +
              '<div class="info">' +
                '<div class="title">' + item.name + "</div>" +
                "<div>电话：" + splitPhone(item.phone) + "</div>" +
                "<div>地址：" + item.address + "</div>" +
                "<div>营业时间：" + item.businessHours + "</div>" +
              "</div>" +
            "</div>"
          );
        }).join("");
      });
  </script>
</body>
</html>
